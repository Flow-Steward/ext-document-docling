manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.docling
kind: tool_provider
version: 0.3.2
display_name: Docling Document Extraction
description: |-
  Prepare documents for agents, classification and review with Docling Document Extraction. It sends a workflow document artifact to an external Docling REST service and returns Markdown plus Docling JSON. It writes both outputs as workflow artifacts, giving later steps readable text and the service's structured document representation. The result also includes inline Markdown, a preview, the full character count and a flag showing whether the inline text was shortened.

  The conversion action supports optional source-format, OCR, OCR-language and table-processing settings. Use it to prepare documents for an agent, pass extracted text into a classification or review step, or preserve converted files for downstream processing. Document-specific field extraction and business rules can be implemented in later workflow steps.

  You can connect a public managed endpoint or a separately deployed Docling service on your own infrastructure. Docling itself is not bundled with the extension. Input documents are limited to 20 MiB, and each output artifact to 50 MiB. Large inline Markdown is shortened while the Markdown artifact retains the complete conversion.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-document-docling/issues
  website_url: https://github.com/Flow-Steward/ext-document-docling
listing:
  category: data
  tags:
  - docling
  - document-extraction
  - markdown
  summary: Convert document artifacts to Markdown and Docling JSON through a managed or self-hosted Docling service.
  setup_summary: Create a project connection with the Docling service base URL and, if required, an API key. Public
    services require HTTPS; private services also require the host's private-remote-URL policy and a network address
    reachable from Flow Steward.
features:
  - tool
  - action
required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
machine_auth:
  service_account_key: svc_ext_docling
  required_scopes:
    - extension:invoke
    - artifact:read
    - artifact:write
account_scope:
  scope_type: project
  description: Docling endpoint configuration is project-scoped and optional API keys are stored as project connection secrets.
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
artifact_policies:
  - operation_id: convert_document
    inputs:
      - kind: artifact
        value_type: artifact_handle
        binding_key: source_document
        field: artifact_handle
        required: true
        max_size_bytes: 20971520
    outputs:
      - kind: artifact
        binding_key: markdown_artifact_handle
        filename: document.md
        content_type: text/markdown
        max_size_bytes: 52428800
        retention_class: run_window
      - kind: artifact
        binding_key: docling_json_artifact_handle
        filename: document.docling.json
        content_type: application/json
        max_size_bytes: 52428800
        retention_class: run_window
entrypoint:
  mode: subprocess
  command:
    - python3
    - main.py
  timeout_seconds: 300
health:
  command:
    - python3
    - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
