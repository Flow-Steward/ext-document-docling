component_id: docling_connection
type: connection_form
title: Docling connection
description: Store the project-scoped Docling service endpoint and optional API key. Public endpoints must use HTTPS.
data:
  connection_kind: extension
  connection_type: docling
  config_fields:
    - base_url
    - request_timeout_seconds
  secret_fields:
    - api_key
defaults:
  display_name: Docling
  request_timeout_seconds: 30
fields:
  - path: display_name
    label: Display name
    widget: text
  - path: environment
    label: Environment
    widget: text
  - path: base_url
    label: Base URL
    widget: text
    required: true
    placeholder: https://docling.example.com
    help: Docling service base URL. Public endpoints must use HTTPS.
  - path: request_timeout_seconds
    label: Request timeout seconds
    widget: integer
    help: Per-request Docling timeout, clamped to 1-240 seconds.
  - path: api_key
    label: API key
    widget: secret
    help: Optional Docling API key sent only as X-Api-Key.
