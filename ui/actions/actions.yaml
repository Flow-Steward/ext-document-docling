actions:
  - action_id: convert_document
    title: Convert Document
    description: Convert one workflow artifact through Docling into Markdown and Docling JSON artifacts.
    required_scopes:
      - extension:invoke
      - artifact:read
      - artifact:write
    handler:
      mode: extension
    mutates_platform: false
    workflow_visible: true
    parameters:
      - name: artifact_handle
        type: artifact_handle
        required: true
      - name: from_format
        type: string
        required: false
      - name: do_ocr
        type: boolean
        required: false
      - name: force_ocr
        type: boolean
        required: false
      - name: ocr_lang
        type: string
        required: false
      - name: table_mode
        type: string
        required: false
    result_fields:
      - markdown_artifact_handle
      - docling_json_artifact_handle
      - markdown_preview
      - markdown_truncated
      - provider_status
      - processing_time
      - timings
      - errors
    error_codes:
      - invalid_payload
      - invalid_connection
      - network_blocked
      - insecure_public_http
      - input_too_large
      - response_too_large
      - output_too_large
      - artifact_access_failed
      - provider_request_failed
      - provider_http_error
      - invalid_provider_response
      - provider_failed
      - missing_markdown
      - missing_docling_json
